name: CI

# push/PRのたびに、最低限の壊れチェックを自動化する。
# 特にPlus Challengeのようにデータ量の多いコミットでは、
# 「問題データの整合性テスト」がここで走ることが重要
# (src/games/__tests__/ 配下。詳細はテストファイル内のコメントを参照)。
on:
  push:
    branches: [main]
  pull_request:

# トークンの最小化: このワークフローはコードの読み取り以外を必要としない
# (リリース作成やパッケージ公開等は別ワークフローの想定)。
permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint / data validation / build / audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check test files (vitest)
        run: npm run typecheck:tests

      - name: Data validation tests (quiz datasets etc.)
        run: npm run test

      - name: Type-check + build (production, excludes test files)
        run: npm run build

      # 既知の脆弱性を持つnpm依存関係が紛れ込んでいないかをCIで機械的に検証する。
      # low/moderateは判断が割れることが多いため、high以上のみを失敗条件にする。
      - name: npm audit (high severity and above)
        run: npm audit --audit-level=high

  backend:
    name: Backend (cargo test / audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # tauri::generate_context!() は frontendDist ("../dist") の実在を
      # コンパイル時に検証するため、cargo test/build の前に必ず
      # フロントエンドをビルドして dist/ を用意しておく必要がある。
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend (creates dist/ for tauri::generate_context!)
        run: npm run build

      # Tauri(Linux)のビルドに必要なシステム依存関係。READMEの
      # 「セットアップ」セクションに記載のものと合わせている。
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libgtk-3-dev libsoup-3.0-dev build-essential

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --lockedにより、Cargo.lockを無視した意図しない依存関係の混入(バージョンの
      # 勝手な繰り上がり)をCIで検知する。
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # Cargo.lockに記録された依存クレートに、RustSecアドバイザリDB上の
      # 既知の脆弱性が無いかを検証する。Cargo.lockをコミット済みなので
      # 即座に効果がある(README「つまずいたポイント」の設計方針=
      # 「主張をコードで検証する」の延長)。
      - name: cargo audit
        working-directory: src-tauri
        run: |
          cargo install cargo-audit --locked
          cargo audit
